name: Build Red Alert APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_mix_zip_url:
        description: 'Необязательно: прямая ссылка на ZIP с файлами .MIX (если пусто — берется из репозитория/Releases GitHub)'
        required: false
        default: ''

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода порта
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Автоматическая загрузка файлов .MIX (CD1 Allies и CD2 Soviet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ra_assets/extracted
          mkdir -p assets/redalert/allies/INSTALL
          mkdir -p assets/redalert/soviet/INSTALL
          mkdir -p assets/redalert/INSTALL

          REPO_ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -n "${{ inputs.custom_mix_zip_url }}" ]; then
            echo "Скачиваем архив по указанной ссылке..."
            curl -L "${{ inputs.custom_mix_zip_url }}" -o /tmp/ra_assets/game.zip
            unzip -o /tmp/ra_assets/game.zip -d /tmp/ra_assets/extracted
          elif [ -n "$REPO_ZIP" ]; then
            echo "Найден архив прямо в репозитории: $REPO_ZIP"
            unzip -o "$REPO_ZIP" -d /tmp/ra_assets/extracted
          elif gh release download --repo "${{ github.repository }}" --pattern "*.zip" --dir /tmp/ra_assets --clobber 2>/dev/null; then
            RELEASE_ZIP=$(find /tmp/ra_assets -maxdepth 1 -type f -iname "*.zip" | head -n 1)
            echo "Скачан архив из GitHub Releases: $RELEASE_ZIP"
            unzip -o "$RELEASE_ZIP" -d /tmp/ra_assets/extracted
          elif [ -d "ra_full" ]; then
            echo "Найдена папка ra_full в репозитории..."
            cp -r ra_full /tmp/ra_assets/extracted/
          else
            echo "Получаем ссылку на базовые файлы Red Alert с зеркала OpenRA..."
            MIRROR_URL=$(curl -sL https://www.openra.net/packages/ra-quickinstall-mirrors.txt | head -n 1 | tr -d '\r')
            curl -L "$MIRROR_URL" -o /tmp/ra_assets/game.zip
            unzip -o /tmp/ra_assets/game.zip -d /tmp/ra_assets/extracted
          fi

          # Ищем папки allies (CD1) и soviet (CD2) на любой глубине (включая внутри ra_full/)
          ALLIES_DIR=$(find /tmp/ra_assets/extracted -type d -iname "allies" | head -n 1)
          SOVIET_DIR=$(find /tmp/ra_assets/extracted -type d -iname "soviet" | head -n 1)

          if [ -n "$ALLIES_DIR" ] && [ -n "$SOVIET_DIR" ]; then
            echo "Найдены папки обоих дисков: $ALLIES_DIR и $SOVIET_DIR"
            find "$ALLIES_DIR" -type f | while read -r f; do
              up=$(basename "$f" | tr '[:lower:]' '[:upper:]')
              cp "$f" "assets/redalert/allies/$up"
              cp "$f" "assets/redalert/$up"
            done
            find "$SOVIET_DIR" -type f | while read -r f; do
              up=$(basename "$f" | tr '[:lower:]' '[:upper:]')
              cp "$f" "assets/redalert/soviet/$up"
            done
          else
            echo "Папки allies/soviet не найдены, копируем общие файлы..."
            find /tmp/ra_assets/extracted -type f | while read -r f; do
              up=$(basename "$f" | tr '[:lower:]' '[:upper:]')
              cp "$f" "assets/redalert/$up"
              cp "$f" "assets/redalert/allies/$up"
              cp "$f" "assets/redalert/soviet/$up"
            done
          fi

          for dir in "assets/redalert" "assets/redalert/allies" "assets/redalert/soviet"; do
            if [ ! -f "$dir/INSTALL/REDALERT.INI" ]; then
              printf "[Intro]\nPlayIntro=yes\n\n[Options]\nGameSpeed=3\nScrollRate=3\nVolume=0.8\nScoreVolume=0.7\n" > "$dir/INSTALL/REDALERT.INI"
              cp "$dir/INSTALL/REDALERT.INI" "$dir/REDALERT.INI"
            fi
          done

          echo "Содержимое диска Allies (CD1):"
          ls -lh assets/redalert/allies/
          echo "Содержимое диска Soviet (CD2):"
          ls -lh assets/redalert/soviet/

      - name: Установка Android SDK и NDK 28.2.13676358
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Сборка Android APK
        run: |
          chmod +x scripts/build_android_debug.sh
          ./scripts/build_android_debug.sh

      - name: Выгрузка готового APK для скачивания на телефон
        uses: actions/upload-artifact@v4
        with:
          name: RedAlert-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
