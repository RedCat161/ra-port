      - name: Автоматическая загрузка файлов .MIX и подготовка папки assets/redalert
        run: |
          mkdir -p /tmp/ra_assets/extracted
          mkdir -p assets/redalert/allies/INSTALL
          mkdir -p assets/redalert/soviet/INSTALL
          mkdir -p assets/redalert/INSTALL

          if [ -n "${{ inputs.custom_mix_zip_url }}" ]; then
            echo "Скачиваем полный пользовательский архив с видео и музыкой..."
            curl -L "${{ inputs.custom_mix_zip_url }}" -o /tmp/ra_assets/game.zip
          else
            echo "Получаем ссылку на базовые файлы Red Alert с зеркала OpenRA..."
            MIRROR_URL=$(curl -sL https://www.openra.net/packages/ra-quickinstall-mirrors.txt | head -n 1 | tr -d '\r')
            curl -L "$MIRROR_URL" -o /tmp/ra_assets/game.zip
          fi

          unzip -o /tmp/ra_assets/game.zip -d /tmp/ra_assets/extracted

          if [ -d "/tmp/ra_assets/extracted/allies" ] && [ -d "/tmp/ra_assets/extracted/soviet" ]; then
            find /tmp/ra_assets/extracted/allies -type f | while read -r f; do
              up=$(basename "$f" | tr '[:lower:]' '[:upper:]')
              cp "$f" "assets/redalert/allies/$up"
              cp "$f" "assets/redalert/$up"
            done
            find /tmp/ra_assets/extracted/soviet -type f | while read -r f; do
              up=$(basename "$f" | tr '[:lower:]' '[:upper:]')
              cp "$f" "assets/redalert/soviet/$up"
            done
          else
            find /tmp/ra_assets/extracted -type f | while read -r f; do
              up=$(basename "$f" | tr '[:lower:]' '[:upper:]')
              cp "$f" "assets/redalert/$up"
              cp "$f" "assets/redalert/allies/$up"
              cp "$f" "assets/redalert/soviet/$up"
            done
          fi

          for dir in "assets/redalert" "assets/redalert/allies" "assets/redalert/soviet"; do
            if [ ! -f "$dir/INSTALL/REDALERT.INI" ]; then
              printf "[Intro]\nPlayIntro=yes\n\n[Options]\nGameSpeed=3\nScrollRate=3\nVolume=0.8\nScoreVolume=0.7\n" > "$dir/INSTALL/REDALERT.INI"
              cp "$dir/INSTALL/REDALERT.INI" "$dir/REDALERT.INI"
            fi
          done
